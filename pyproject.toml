[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bipst-shot-peening"
version = "0.1.0"
description = "Prompt-feedback distillation for lightweight shot-peening segmentation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.4,<3", "torchvision>=0.19,<1", "numpy>=1.24,<2", "opencv-python>=4.8,<5", "scikit-learn>=1.2,<2", "Pillow>=9", "matplotlib>=3.7,<4", "scipy>=1.10", "tqdm"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bipst*", "segment_anything*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
